apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  container-metrics.json: |
    {
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "panels": [
        {
          "title": "Cluster Resource Allocation - CPU Overtime",
          "type": "timeseries",
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["production", "devops", "sre"],
      "timezone": "utc",
      "title": "Kubernetes SRE Cluster Health Overview"
    }
